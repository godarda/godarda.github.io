<!--
  File: _includes/search.html
  Purpose: Defines the HTML structure for the site's reusable search component.
  It includes the search input, icons for voice/close, dynamic suggestion placeholders,
  and the results container. All interactive logic is handled by /assets/js/search.js.
-->

{%- assign path = page.url | split: '/' -%}
{%- if path[1] == nil -%}{%- assign home = true -%}{%- endif -%}
<!-- Set global JS variables for search context and JSON URL -->
<script>window.gd_path1 = '{{ path[1] | default: "search" }}';</script>
<script>window.gd_search_url = '{{ "/search.json" | relative_url }}';</script>
<!-- Load the main search script -->
<script src="{{ site.search_js | relative_url }}"></script>
<style>
    #GDSInput {
        border-radius: 0px;
        border-right: none;
        border-left: none;
        padding-left: 0px;
        font-size: 15px;
    }

    #GDSInput:focus {
        outline: none;
        border-color: var(--color1);
        box-shadow: none;
    }

    #GDSInput:focus-visible {
        outline: none !important;
    }

    .search-input-group,
    .search-input-group > .input-group-text,
    .search-input-group > .form-control {
        height: 48px;
        box-sizing: border-box;
    }

    .search-input-group {
        overflow: hidden;
        border: 1px solid var(--surface-border);
        border-radius: 50rem;
        background-color: var(--search-field-bg);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        transition: border-color .18s ease, box-shadow .18s ease;
    }

    .search-input-group:focus-within {
        border-color: var(--search-focus);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--search-focus) 14%, transparent);
    }

    .search-input-group > .input-group-text,
    .search-input-group > .form-control {
        border: 0;
        background-color: var(--search-field-bg);
    }

    #mic_icon {
        border: 0;
        color: #999;
        font-size: 20px;
        padding-left: 10px;
        padding-right: 15px;
        background-color: var(--search-field-bg);
        cursor: pointer;
        display: flex;
        align-items: center;
    }

    #search_icon {
        border: 0;
        color: #999;
        padding-left: 15px;
        padding-right: 10px;
        background-color: var(--search-field-bg);
        display: flex;
        align-items: center;
        font-size: 16px;
    }

    #close_icon {
        border: 0;
        color: #999;
        padding-left: 0px;
        padding-right: 0px;
        background-color: var(--search-field-bg);
        cursor: pointer;
    }

    #search-hints .btn-outline.theme-secondary.active,
    #search-hints .btn-outline.theme-secondary:focus {
        box-shadow: none;
    }

    #search-hints .btn-outline.theme-secondary {
        border-radius: 50rem;
        padding: 4px 8px;
        line-height: 1.3;
        min-height: 0;
        height: auto;
    }

    .search-loading {
        position: relative;
        overflow: hidden;
    }

    .search-loading::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        height: 2px;
        z-index: 5;
        width: var(--search-progress, 0%);
        transition: width 0.1s linear;
    }

    .search-loading.indeterminate::after {
        width: 100%;
        transform: translateX(-100%);
        animation: loading-slide 1.5s infinite;
    }

    @keyframes loading-slide {
        0% {
            transform: translateX(-100%);
        }

        100% {
            transform: translateX(100%);
        }
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .spin-animation { animation: spin 0.5s linear; }
    .search-results-elevated::-webkit-scrollbar { width: 6px; }
    .search-results-elevated::-webkit-scrollbar-track { background: transparent; }
    .search-results-elevated::-webkit-scrollbar-thumb { background-color: rgba(150, 150, 150, 0.5); border-radius: 3px; }
    .search-results-elevated { scrollbar-width: thin; scrollbar-color: rgba(150, 150, 150, 0.5) transparent; }

    #search-backdrop {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1010;
        background-color: var(--search-backdrop-color);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: none;
    }
    .search-elevated {
        position: relative;
        z-index: 1020;
    }
    .search-results-elevated {
        position: relative;
        z-index: 1019;
    }
</style>
<div class="container search-page-container" {% if home %}style="min-height: 80vh; display: flex; flex-direction: column; justify-content: center;"{% endif %}>
    <div id="search-backdrop"></div>
    <center>
        <div class="col-12 sm:col-11 md:col-9 lg:col-7 xl:col-6 2xl:col-6" style="margin-bottom: 25px;">
            {%- if home -%}
            <!-- Display site title and tagline only on the home page -->
            <h2 id="fc-{{ path[1] }}">GoDarda</h2>
            <h6 style="padding-top: 5px; padding-bottom: 10px;">{{ site.tagline }}</h6>
            {%- endif -%}

            <!-- Main search input group -->
            <div id="GDS_input-{{ path[1] | default: 'search' }}" class="input-group input-group-lg search-input-group">
                <!-- Search icon (visible by default) -->
                <span id="search_icon" class="input-group-text"><i class="bi bi-search"></i></span>
                <input id="GDSInput" class="form-control" type="text" tabindex="1"
                    placeholder="{{ page.title }} (type to get the results)">
                <!-- Close/clear icon (hidden by default) -->
                <span id="close_icon" class="input-group-text" style="display: none;"><i class="bi bi-x-lg"></i></span>
                <!-- Voice search icon -->
                <span id="mic_icon" class="input-group-text"><i class="bi bi-mic"></i></span>
            </div>
            <!-- Container for search suggestions -->
            <div id="hints-container" style="margin-top: 10px; text-align: center; min-height: 35px;">
                <span class="fg-secondary" style="margin-right: 5px;"><i id="hint-icon"
                        class="bi bi-lightbulb"></i> Hints:</span>
                <span id="search-hints"></span>
            </div>
            <!-- Container for displaying the number of search results -->
            <div id="matchCount" class="fg-secondary small" style="margin-top:8px; display:none; text-align:center"></div>
        </div>

        <!-- Main container where search results are rendered -->
        <div id="{{ path[1] | default: 'search' }}" class="col-12 sm:col-12 md:col-10 lg:col-8 xl:col-7 2xl:col-7"
            style="text-align: left; margin-bottom: 30px;"></div>
    </center>
</div>
