<!--
  File: _includes/tools.html
  Purpose: A reusable template for tools.
  It provides a standard layout with a results grid, input area (custom or default),
  and control buttons.
  Logic is handled by /assets/js/tools.js.
-->

{%- assign path = page.url | split: '/' -%}
{%- assign tool_urls = site.data.tools.tools.segments | map: "url" -%}
<link rel="stylesheet" href="/assets/css/tools.css">
<script src="/assets/js/tools.js"></script>

<div class="calc-panel">
    <div class="row g-7">
        <div class="col-12">
            <!--
              Results Container:
              Populated dynamically by tools.js based on the tool's configuration.
              Displays calculation results or conversion outputs in a grid.
            -->
            <div id="resultsContainer" class="row row-cols-1 md:row-cols-2 g-3 mb-5" data-category="{% if tool_urls contains path[1] %}{{ path[1] }}{% endif %}"></div>

            <!--
              Inputs Section:
              If 'tools_inputs' is defined in the parent layout, render custom inputs.
              Otherwise, render the default input group used for standard unit converters.
            -->
            {% if tools_inputs %}
            <div class="mb-3">
                {{ tools_inputs }}
            </div>
            {% else %}
            <!-- Default Converter Inputs: Numeric input + Unit dropdown -->
            <div class="input-group mb-3">
                <input type="number" id="inputValue" class="form-control" placeholder="Enter value..." aria-label="Input value">
                <select class="form-control" id="inputUnit" aria-label="Select unit">
                    <!-- Options will be injected here by tools.js -->
                </select>
            </div>
            {% endif %}

            <!-- Control Buttons: Clear, Select Tiles (Dropdown), Help -->
            <div class="row g-3 mt-3">
                <div class="col-auto">
                    <button id="btnClear" class="btn-outline theme-secondary btn-sm">Clear</button>
                </div>
                <div class="col-auto">
                    <!--
                      Select Tiles Dropdown:
                      Allows users to toggle visibility of specific result tiles.
                      Options are generated dynamically based on the tool's stats.
                    -->
                    <div class="menu-container">
                        <button class="btn-outline theme-secondary btn-sm" type="button" id="viewOptionsBtn" aria-controls="viewOptionsMenu" data-bs-toggle="menu" aria-expanded="false" data-bs-auto-close="outside">
                            {{ select_button_text | default: "Select Tiles" }}
                        </button>
                        <div class="menu" id="viewOptionsMenu" aria-labelledby="viewOptionsBtn" style="min-width: 220px;"></div>
                    </div>
                </div>
                <div class="col-auto">
                    <button type="button" class="btn-outline theme-secondary btn-sm" data-bs-toggle="dialog" data-bs-target="#helpModal">
                        Help
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!--
  Help Modal:
  Displays context-specific help content passed via the 'help_content' variable.
-->
<dialog class="dialog" id="helpModal" tabindex="-1" aria-labelledby="helpModalLabel">
    <div class="dialog-header">
        <h5 class="dialog-title" id="helpModalLabel"><span id="fc-{{ path[1] }}"><i class="bi bi-info-circle"></i> {{ page.title }} Help</span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
    </div>
    <div class="dialog-body">
        {{ help_content }}
    </div>
</dialog>
